steps:
  # # ==========================================
  # # STEP 0: Build the Docker Image
  # # ==========================================
  # - name: "gcr.io/cloud-builders/docker"
  #   id: "Build Docker Image"
  #   args:
  #     - "build"
  #     - "-t"
  #     - "us-central1-docker.pkg.dev/$PROJECT_ID/testing/iris-classifier:$COMMIT_SHA"
  #     - "."

  # # ==========================================
  # # STEP 1: Push Image to Regional Artifact Registry
  # # ==========================================
  # - name: "gcr.io/cloud-builders/docker"
  #   id: "Push to Artifact Registry"
  #   args:
  #     - "push"
  #     - "us-central1-docker.pkg.dev/$PROJECT_ID/testing/iris-classifier:$COMMIT_SHA"

  # ==========================================
  # STEP 2: Connect to VM & Execute Smart Deployment
  # ==========================================
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "Deploy to Compute Engine VM"
    entrypoint: "gcloud"
    args:
      - "compute"
      - "ssh"
      - "testing-cloudbuild" # Your actual VM instance name
      - "--zone=us-central1-a" # Your actual VM zone
      - "--command"
      - |
        set -e 

        echo "====== 1. CLEANING OLD LEFTOVER CONFIGS ======"
        # Remove any old broken ubuntu repository file if it exists on the VM
        sudo rm -f /etc/apt/sources.list.d/docker.list

        echo "====== 2. CHECKING DOCKER INSTALLATION ======"
        if ! command -v docker &> /dev/null; then
            echo "Docker is missing. Commencing automated Debian installation..."
            sudo apt-get update -y
            sudo apt-get install -y ca-certificates curl gnupg lsb-release
            
            # Create the keyring directory and fetch Debian-specific Docker GPG keys
            sudo install -m 0755 -d /usr/share/keyrings
            curl -fsSL https://download.docker.com/linux/debian/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
            sudo chmod a+r /usr/share/keyrings/docker-archive-keyring.gpg

            # Add the official DEBIAN Docker repository
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/debian $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            
            sudo apt-get update -y
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io
            sudo systemctl start docker
            sudo systemctl enable docker
            echo "Docker successfully installed on Debian!"
        else
            echo "Docker presence detected. Skipping installation step."
        fi

        echo "====== 3. CONFIGURING REGISTRY CREDENTIALS ======"
        sudo gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

        echo "====== 4. PULLING LATEST CONTAINER IMAGE ======"
        sudo docker pull us-central1-docker.pkg.dev/$PROJECT_ID/testing/iris-classifier:$COMMIT_SHA

        echo "====== 5. RESTARTING APP CONTAINER ON PORT 5000 ======"
        sudo docker stop iris-container || true
        sudo docker rm iris-container || true

        sudo docker run -d \
          --name iris-container \
          --restart always \
          -p 80:5000 \
          us-central1-docker.pkg.dev/$PROJECT_ID/testing/iris-classifier:$COMMIT_SHA

        echo "====== DEPLOYMENT SUCCESSFUL ======"

# ==========================================
# GLOBAL OPTIONS: Fixes the Service Account logging issue
# ==========================================
options:
  logging: CLOUD_LOGGING_ONLY
